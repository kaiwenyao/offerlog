openapi: 3.1.0
info:
  title: OfferLog API
  version: 0.1.0
  description: |
    求职追踪系统后端契约（计划 §9）。所有业务端点位于 /api/v1 且要求会话；
    写请求需携带 X-CSRF-Token（登录返回 csrf_token）。错误统一为
    {code,message,request_id}。
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: offerlog_session
  schemas:
    Application:
      type: object
      properties:
        id: { type: integer }
        company_name: { type: string }
        position: { type: string }
        status:
          type: string
          enum: [saved, preparing, applied, screening, assessment,
                 interviewing, offer, accepted, rejected, withdrawn, closed]
        substatus:
          type: string
          description: |
            大阶段内的具体进度（方案 §3.1）。"" = 未细分（旧数据与无细分阶段）。
            合法组合由后端定义：preparing=ready；screening/interviewing=
            awaiting_schedule|preparing|completed；assessment=preparing|completed|passed；
            offer=reviewing|negotiating|ready_to_accept。非法组合返回 invalid_substatus。
        focus_activity_kind:
          type: string
          enum: ['', assessment, interview]
          description: 当前关注的活动类型；与 focus_activity_id 一起决定列表主标签
        focus_activity_id: { type: [integer, 'null'] }
        channel: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        tags: { type: array, items: { type: string } }
        deadline: { type: string, format: date, description: YYYY-MM-DD（按用户时区的日历日，非时间戳） }
        next_action_due_at: { type: string, format: date, description: YYYY-MM-DD（按用户时区的日历日，非时间戳） }
        stage_history:
          type: object
          description: include=stage_history 时返回：已到达状态 → 最早到达日（用户时区 YYYY-MM-DD）
          additionalProperties: { type: string }
        progress_since:
          type: string
          description: include=stage_history 时返回：当前进度进入的日期（更正后按更正时间算）
        version: { type: integer, description: 乐观锁版本 }
        archived: { type: boolean }
        deleted: { type: boolean }
    MilestoneInput:
      type: object
      properties:
        kind:
          type: string
          description: |
            事件类型 slug（开放集合，≤40 字，不含空白与「·」）。建议值见
            /meta/status-model 的 milestone_kinds；未知类型照存不误，但不改变阶段。
        label: { type: string, description: 展示名（≤100 字），留空按 kind 取默认名 }
        occurred_at:
          type: [string, 'null']
          format: date-time
          description: 业务发生时间；PATCH 时不传表示保持不变
        clear_occurred_at:
          type: boolean
          description: PATCH 专用——显式清空时间（回到「时间未定」）
        note: { type: string, description: 备注（≤2000 字）；终态事件的备注会成为岗位的「原因」 }
      # status_effect 是只读的：由服务端按 kind 推导，请求体里传了也会被忽略，
      # 否则调用方可以绕过类型表把岗位设成任意阶段。
    AssessmentRoundInput:
      type: object
      description: 一轮 OA / 作业（方案 §3.2）。收到、计划、截止、完成四种时间各自保存，互不覆盖。
      properties:
        kind: { type: string, enum: [online_test, take_home, other] }
        name: { type: string }
        progress: { type: string, enum: [awaiting_schedule, preparing, completed, cancelled] }
        result:
          type: string
          enum: [unknown, passed, failed]
          description: 完成 ≠ 通过；进度未完成时不允许写 passed/failed（result_before_completion）
        invited_at: { type: [string, 'null'], format: date-time }
        planned_at: { type: [string, 'null'], format: date-time }
        due_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        completed_unknown:
          type: boolean
          description: 完成了但时间不详；不伪造精确时间
        link: { type: string }
        notes: { type: string }
    InterviewRoundInput:
      type: object
      properties:
        round_name: { type: string }
        format: { type: string }
        scheduled_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        progress: { type: string, enum: [awaiting_schedule, preparing, completed, cancelled] }
        result: { type: string, enum: [unknown, passed, failed] }
        invited_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        completed_unknown: { type: boolean }
    FilterCondition:
      type: object
      properties:
        field: { type: string, description: 内置字段或自定义属性 key }
        op:
          type: string
          enum: [eq, neq, contains, starts_with, gt, lt, gte, lte, in, is_empty, is_not_empty]
        value: {}
    FilterGroup:
      type: object
      properties:
        op: { type: string, enum: [and, or] }
        conditions: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/FilterCondition' }, { $ref: '#/components/schemas/FilterGroup' }] } }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
paths:
  /auth/login:
    post:
      summary: 登录，返回 csrf_token 并设置会话 cookie
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 成功
        '401': { description: 凭据错误 }
  /auth/logout:
    post: { summary: 注销 }
  /auth/me:
    get: { summary: 当前用户 }
    patch:
      summary: 更新当前账号显示名/时区（persist 到 users + 会话同步）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                timezone: { type: string }
  /applications:
    get:
      summary: 分页列表（status/search/trash/archived 查询参数；include=stage_history 附加每行最早到达日期）
      parameters:
        - name: include
          in: query
          schema: { type: string }
          description: CSV，如 include=stage_history —— 行对象附加 stage_history（状态 → 用户时区最早日历日）
    post:
      summary: 创建（仅 company_name/position 必填；同公司同名仅提示不禁止）
  /applications/parse-url:
    post:
      summary: 解析 JD 链接预填公司/岗位/城市（SSRF 防护；失败返回 200 + 空字段）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '200':
          description: 解析成功或解析失败均 200（空字段表示未能预填）
        '400': { description: 链接非 http/https 或缺 url }
        '429': { description: 超过每分钟解析次数 }
  /applications/{id}:
    get: { summary: 详情（回收站中的软删除记录同样返回，deleted 字段标识） }
    patch:
      summary: 普通字段更新（携带 version，冲突返回 409）
    delete: { summary: 软删除 }
  /applications/{id}/transitions:
    post:
      deprecated: true
      summary: 状态转换（旧的固定流程接口；迁移 00006 起界面不再调用）
      description: |
        方案 §4.1：任意非终态 → 任意非终态（含回退），终态 → 非终态需填原因；
        进入 accepted 只允许从 offer，accepted → withdrawn（毁约）单独放行。
        终态之间的更正必须走 /correct-current。「之前选错了」也不能走这里，
        传 change_type=correct 会被拒绝（use_correction），以免误操作被记成真实经历。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to_status, version]
              properties:
                to_status: { type: string }
                to_substatus:
                  type: string
                  description: 目标阶段内的具体进度；同阶段不传则保留原值，跨阶段不沿用旧值
                occurred_at: { type: string, format: date-time }
                reason: { type: string }
                note: { type: string }
                submitted_at: { type: string, format: date-time }
                first_response_at: { type: string, format: date-time }
                # 未经正式投递（内推 / 猎头直接约面）：满足进入招聘阶段的投递证据
                # 要求，但不写入 submitted_at，避免污染投递→回复口径。
                no_formal_submission: { type: boolean }
                idempotency_key: { type: string }
                change_type:
                  type: string
                  enum: ['', rollback, reopen]
                  description: 变更类型；留空由服务端按流程顺序推导（advance/rollback/reopen）
                focus_activity_kind: { type: string, enum: ['', assessment, interview] }
                focus_activity_id: { type: [integer, 'null'] }
                clear_focus: { type: boolean }
                assessment:
                  $ref: '#/components/schemas/AssessmentRoundInput'
                interview:
                  $ref: '#/components/schemas/InterviewRoundInput'
  /applications/{id}/correct-current:
    post:
      deprecated: true
      summary: 更正当前进度（「之前选错了」；旧固定流程接口）
      description: |
        方案 §4.2：把当前有效进度改成另一个（阶段, 子状态）。自动挑选最近一条未被
        更正的状态事件作为更正对象（可用 corrected_event_id 指定），插入 correction
        事件后按 sequence 重放有效历史，重算 status/substatus/投递与 Offer 事实。
        旧事件保留审计，不计入有效完成次数。后续事件若因此不成立，返回
        correction_invalid 而不是静默删除下游记录。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to_status, version]
              properties:
                to_status: { type: string }
                to_substatus: { type: string }
                reason: { type: string }
                occurred_at: { type: string, format: date-time }
                version: { type: integer }
                corrected_event_id: { type: [integer, 'null'] }
  /applications/{id}/events:
    get:
      summary: 旧的状态事件审计（只读历史；时间线与 milestones 合并展示）
      description: |
        迁移 00006 起，进度由 /milestones 记录，这里只剩「更新进度」时代留下的
        追加式审计。前端把两者按业务时间合并渲染：事件行只读，节点行可编辑可删除。
  /applications/{id}/corrections:
    post:
      deprecated: true
      summary: 历史纠正（指定事件 id，保留 corrects_event_id 审计；旧固定流程接口）
  /applications/{id}/restore: { post: { summary: 从回收站恢复 } }
  /applications/{id}/archive: { post: { summary: 归档 } }
  /applications/{id}/unarchive: { post: { summary: 取消归档 } }
  /applications/bulk:
    post:
      summary: 批量（标签/优先级/归档，≤100 条）
  /applications/{id}/interviews: { get: {}, post: { summary: 安排面试轮次 } }
  /applications/{id}/assessments:
    get: { summary: OA / 作业轮次列表（按轮次，不覆盖上一轮） }
    post:
      summary: 新增一轮 OA / 作业（种、名、进度、结果与四种时间）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentRoundInput' }
  /applications/{id}/assessments/{assessment_id}:
    patch:
      summary: 更新一轮 OA / 作业（未提及的完成事实不会被清空）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentRoundInput' }
    delete: { summary: 删除一轮 OA / 作业 }
  /applications/{id}/assessments/{assessment_id}/complete:
    post:
      summary: 标记某轮 OA 已完成（同时把申请进度同步为已完成·等结果）
  /applications/{id}/assessments/{assessment_id}/reopen: { post: { summary: 撤回某轮 OA 的完成标记 } }
  /applications/{id}/interviews/{interview_id}/complete:
    post:
      summary: 标记本轮面试已完成（完成 ≠ 通过，不会自动通过或结束申请）
  /applications/{id}/interviews/{interview_id}/reopen: { post: { summary: 撤回本轮面试的完成标记 } }
  /applications/{id}/milestones:
    get:
      summary: 时间线事件列表（按业务时间升序，时间未定的排最后）
    post:
      summary: 添加一个时间线事件
      description: |
        迁移 00006：记录进度的唯一入口。用户只说「发生了什么」——岗位阶段由服务端
        按 kind 推导（status_effect），当前状态 = 时间线上最后一个带 status_effect
        的事件。没有目标阶段选择、没有子状态、没有必填原因。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '201': { description: 已创建；响应含服务端推导出的 status_effect }
        '400': { description: kind / label / note 不合法 }
        '404': { description: 岗位不存在或不属于当前用户 }
  /applications/{id}/milestones/{milestone_id}:
    patch:
      summary: 编辑一个时间线事件（未提及的字段保持不变）
      description: |
        改时间会让时间线重排，改类型会换掉阶段效果——两者都可能换掉「最后一格」，
        所以服务端在同一事务里重算岗位阶段。清空时间用 clear_occurred_at（线上
        无法区分「没传」与「传了 null」）。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
    delete:
      summary: 移除一个时间线事件（状态随之退回上一格）
  /meta/status-model:
    get:
      summary: 大阶段 / 合法子状态组合 / 事件类型清单（方案 §6.5 + 迁移 00006）
      description: |
        单一白名单，前端据此渲染，避免两套手写表。
        milestone_kinds 是「添加事件」选择器与参考流程图的数据源：每项为
        {key, label, status_effect, group}，status_effect 为空表示这个事件只记在
        时间线上、不改变岗位阶段。
        targets 是旧固定流程选择器的遗留字段，界面已不再消费。
  /applications/{id}/actions: { get: {}, post: {} }
  /applications/{id}/notes: { get: {}, post: {} }
  /actions:
    get: { summary: 今日待办用的跨申请开放行动项（open=1） }
  /files:
    post:
      summary: 流式上传（multipart file + category + 可选 application_id / interview_id）
      description: 单文件 ≤20MiB；允许 PDF/DOCX/TXT/PNG/JPEG。interview_id 需归属当前用户且属于该 application_id
    get: { summary: 文件列表（可 filter application_id；每行含 interview_id） }
  /files/{id}/download:
    get: { summary: 鉴权后下载（校验 owner） }
  /files/{id}:
    delete: { summary: 删除文件（清理申请关联与引用它的自定义字段；单用户私有无共享） }
  /views:
    get: {}
    post:
      summary: 保存视图（name/layout/filter_ast/sort/columns）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                layout: { type: string, enum: [table, board, list] }
                filter_ast: { type: array, items: { $ref: '#/components/schemas/FilterGroup' } }
                sort: { type: array, items: { type: object } }
  /views/query:
    post:
      summary: 服务端筛选/排序/分页查询（校验字段与权限，参数化 SQL）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: { type: array, items: { $ref: '#/components/schemas/FilterGroup' } }
                sort: { type: array, items: { type: object } }
                page: { type: integer }
                page_size: { type: integer }
                include: { type: array, items: { type: string, enum: [stage_history] }, description: 附加每行 stage_history（状态 → 用户时区最早日历日） }
  /search:
    get:
      summary: ⌘K 命令面板跨实体搜索（岗位/公司/文件，仅当前 owner；空 q 返回最近记录）
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
  /properties:
    get: {}
    post: { summary: 创建自定义属性（text/number/select/multi_select/date/checkbox/url/image） }
  /analytics/summary:
    post: { summary: 指标（§5.2 口径） }
  /analytics/sankey:
    post:
      summary: 桑基 A（当前快照）或 B（历史路径 mode=history）
  /analytics/drilldowns/{token}:
    get: { summary: 快照下钻成员（过期返回 404） }
  /imports/preview:
    post: { summary: CSV 预检（映射/类型错误/重复候选） }
  /imports/{batch_id}/commit:
    post: { summary: 幂等提交 }
  /exports/applications.csv:
    get: { summary: CSV 导出（公式注入转义） }
  /health/live:
    get: {}
  /health/ready:
    get: { summary: 检查 DB 与 schema }
  /home/summary:
    get:
      summary: 首页全量汇总（服务端统计，周窗口与周条均为用户每周起始日的半开区间；含跨岗位近期面试、OA 轮次与统一待办计数）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
          description: 近期面试 / OA 条数上限（默认 5）；upcoming 与 upcoming_assessments 同用
  /preferences:
    get: { summary: 当前账号偏好（显示名/时区/每周起始/提醒开关），默认值未保存时返回缺省 }
    put:
      summary: 保存账号偏好（可选字段部分更新；时区需为 IANA 名称）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                timezone: { type: string }
                week_start: { type: integer, minimum: 0, maximum: 6 }
                remind_overdue: { type: boolean }
                remind_interview: { type: boolean }
                remind_stale_days: { type: integer, minimum: 0, maximum: 365 }
                remind_weekly: { type: boolean }
  /notifications:
    get: { summary: 站内提醒列表（open=1 只看未读未忽略） }
  /notifications/read-all:
    post: { summary: 全部标为已读 }
  /notifications/{id}/read:
    post:
      summary: 标记已读（仅真实不存在/非本人返回 404；DB 故障按 500 返回，不伪装成 404）
  /notifications/{id}/dismiss:
    post: { summary: 忽略（不删除，保留历史） }
  /calendar:
    get:
      summary: 跨岗位日程（?from=ISO&to=ISO，半开区间；面试/OA 轮次/OA 截止/待办/截止/Offer 答复）
      description: |
        kind 取值：interview（面试）、assessment（OA / 作业轮次的计划时间，
        已完成灰显）、assessment_due（仍开放轮次的截止时间，完成 / 取消后不再
        返回）、action、deadline、offer_decision。
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
  # --- date-only wire semantics ---
  # DATE-backed columns (actions.due_date, applications.deadline,
  # applications.next_action_due_at) travel as YYYY-MM-DD strings — never
  # timestamps — and are stored as the user's calendar day. Instant columns
  # (due_ts, submitted_at, …) remain RFC3339.
  /actions/{action_id}/postpone:
    post:
      summary: 延期行动项（due_date 为 YYYY-MM-DD 或 due_ts；空白 due_date = 清除截止）
      parameters:
        - name: action_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer }
                due_date: { type: string, format: date }
                due_ts: { type: string, format: date-time }
  /applications/{id}/interviews/{interview_id}/cancel:
    post:
      summary: 取消面试轮次（保留记录，取消状态同步到首页/日历/提醒；非本人 404）
  /applications/{id}/interviews/{interview_id}/uncancel:
    post:
      summary: 恢复被取消的面试轮次
