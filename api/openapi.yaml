openapi: 3.1.0
info:
  title: OfferLog API
  version: 0.1.0
  description: |
    求职追踪系统后端契约（计划 §9）。所有业务端点位于 /api/v1 且要求会话；
    写请求需携带 X-CSRF-Token（登录返回 csrf_token）。错误统一为
    {code,message,request_id}。
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: offerlog_session
  schemas:
    Application:
      type: object
      properties:
        id: { type: integer }
        company_name: { type: string }
        position: { type: string }
        status:
          type: string
          enum: [saved, preparing, applied, screening, assessment,
                 interviewing, offer, accepted, rejected, withdrawn, closed]
        channel: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        tags: { type: array, items: { type: string } }
        deadline: { type: string, format: date, description: YYYY-MM-DD（按用户时区的日历日，非时间戳） }
        next_action_due_at: { type: string, format: date, description: YYYY-MM-DD（按用户时区的日历日，非时间戳） }
        version: { type: integer, description: 乐观锁版本 }
        archived: { type: boolean }
        deleted: { type: boolean }
    FilterCondition:
      type: object
      properties:
        field: { type: string, description: 内置字段或自定义属性 key }
        op:
          type: string
          enum: [eq, neq, contains, starts_with, gt, lt, gte, lte, in, is_empty, is_not_empty]
        value: {}
    FilterGroup:
      type: object
      properties:
        op: { type: string, enum: [and, or] }
        conditions: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/FilterCondition' }, { $ref: '#/components/schemas/FilterGroup' }] } }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
paths:
  /auth/login:
    post:
      summary: 登录，返回 csrf_token 并设置会话 cookie
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 成功
        '401': { description: 凭据错误 }
  /auth/logout:
    post: { summary: 注销 }
  /auth/me:
    get: { summary: 当前用户 }
    patch:
      summary: 更新当前账号显示名/时区（persist 到 users + 会话同步）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                timezone: { type: string }
  /applications:
    get:
      summary: 分页列表（status/search/trash/archived 查询参数；include=stage_history 附加每行最早到达日期）
      parameters:
        - name: include
          in: query
          schema: { type: string }
          description: CSV，如 include=stage_history —— 行对象附加 stage_history（状态 → 用户时区最早日历日）
    post:
      summary: 创建（仅 company_name/position 必填；同公司同名仅提示不禁止）
  /applications/parse-url:
    post:
      summary: 解析 JD 链接预填公司/岗位/城市（SSRF 防护；失败返回 200 + 空字段）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '200':
          description: 解析成功或解析失败均 200（空字段表示未能预填）
        '400': { description: 链接非 http/https 或缺 url }
        '429': { description: 超过每分钟解析次数 }
  /applications/{id}:
    get: { summary: 详情（回收站中的软删除记录同样返回，deleted 字段标识） }
    patch:
      summary: 普通字段更新（携带 version，冲突返回 409）
    delete: { summary: 软删除 }
  /applications/{id}/transitions:
    post:
      summary: 状态转换（version + idempotency_key；规则见领域层）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to_status, version]
              properties:
                to_status: { type: string }
                occurred_at: { type: string, format: date-time }
                reason: { type: string }
                note: { type: string }
                submitted_at: { type: string, format: date-time }
                first_response_at: { type: string, format: date-time }
                idempotency_key: { type: string }
  /applications/{id}/events:
    get: { summary: 状态时间线 }
  /applications/{id}/corrections:
    post:
      summary: 历史纠正（保留 corrects_event_id 审计）
  /applications/{id}/restore: { post: { summary: 从回收站恢复 } }
  /applications/{id}/archive: { post: { summary: 归档 } }
  /applications/{id}/unarchive: { post: { summary: 取消归档 } }
  /applications/bulk:
    post:
      summary: 批量（标签/优先级/归档，≤100 条）
  /applications/{id}/interviews: { get: {}, post: { summary: 安排面试轮次 } }
  /applications/{id}/actions: { get: {}, post: {} }
  /applications/{id}/notes: { get: {}, post: {} }
  /actions:
    get: { summary: 今日待办用的跨申请开放行动项（open=1） }
  /files:
    post:
      summary: 流式上传（multipart file + category + 可选 application_id / interview_id）
      description: 单文件 ≤20MiB；允许 PDF/DOCX/TXT/PNG/JPEG。interview_id 需归属当前用户且属于该 application_id
    get: { summary: 文件列表（可 filter application_id；每行含 interview_id） }
  /files/{id}/download:
    get: { summary: 鉴权后下载（校验 owner） }
  /files/{id}:
    delete: { summary: 删除文件（清理申请关联与引用它的自定义字段；单用户私有无共享） }
  /views:
    get: {}
    post:
      summary: 保存视图（name/layout/filter_ast/sort/columns）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                layout: { type: string, enum: [table, board, list] }
                filter_ast: { type: array, items: { $ref: '#/components/schemas/FilterGroup' } }
                sort: { type: array, items: { type: object } }
  /views/query:
    post:
      summary: 服务端筛选/排序/分页查询（校验字段与权限，参数化 SQL）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: { type: array, items: { $ref: '#/components/schemas/FilterGroup' } }
                sort: { type: array, items: { type: object } }
                page: { type: integer }
                page_size: { type: integer }
                include: { type: array, items: { type: string, enum: [stage_history] }, description: 附加每行 stage_history（状态 → 用户时区最早日历日） }
  /search:
    get:
      summary: ⌘K 命令面板跨实体搜索（岗位/公司/文件，仅当前 owner；空 q 返回最近记录）
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
  /properties:
    get: {}
    post: { summary: 创建自定义属性（text/number/select/multi_select/date/checkbox/url/image） }
  /analytics/summary:
    post: { summary: 指标（§5.2 口径） }
  /analytics/sankey:
    post:
      summary: 桑基 A（当前快照）或 B（历史路径 mode=history）
  /analytics/drilldowns/{token}:
    get: { summary: 快照下钻成员（过期返回 404） }
  /imports/preview:
    post: { summary: CSV 预检（映射/类型错误/重复候选） }
  /imports/{batch_id}/commit:
    post: { summary: 幂等提交 }
  /exports/applications.csv:
    get: { summary: CSV 导出（公式注入转义） }
  /health/live:
    get: {}
  /health/ready:
    get: { summary: 检查 DB 与 schema }
  /home/summary:
    get:
      summary: 首页全量汇总（服务端统计，周窗口与周条均为用户每周起始日的半开区间；含跨岗位近期面试与统一待办计数）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
          description: 近期面试条数上限（默认 5）
  /preferences:
    get: { summary: 当前账号偏好（显示名/时区/每周起始/提醒开关），默认值未保存时返回缺省 }
    put:
      summary: 保存账号偏好（可选字段部分更新；时区需为 IANA 名称）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                timezone: { type: string }
                week_start: { type: integer, minimum: 0, maximum: 6 }
                remind_overdue: { type: boolean }
                remind_interview: { type: boolean }
                remind_stale_days: { type: integer, minimum: 0, maximum: 365 }
                remind_weekly: { type: boolean }
  /notifications:
    get: { summary: 站内提醒列表（open=1 只看未读未忽略） }
  /notifications/read-all:
    post: { summary: 全部标为已读 }
  /notifications/{id}/read:
    post:
      summary: 标记已读（仅真实不存在/非本人返回 404；DB 故障按 500 返回，不伪装成 404）
  /notifications/{id}/dismiss:
    post: { summary: 忽略（不删除，保留历史） }
  /calendar:
    get:
      summary: 跨岗位日程（?from=ISO&to=ISO，半开区间；面试/待办/截止/Offer 答复）
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
  # --- date-only wire semantics ---
  # DATE-backed columns (actions.due_date, applications.deadline,
  # applications.next_action_due_at) travel as YYYY-MM-DD strings — never
  # timestamps — and are stored as the user's calendar day. Instant columns
  # (due_ts, submitted_at, …) remain RFC3339.
  /actions/{action_id}/postpone:
    post:
      summary: 延期行动项（due_date 为 YYYY-MM-DD 或 due_ts；空白 due_date = 清除截止）
      parameters:
        - name: action_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer }
                due_date: { type: string, format: date }
                due_ts: { type: string, format: date-time }
  /applications/{id}/interviews/{interview_id}/cancel:
    post:
      summary: 取消面试轮次（保留记录，取消状态同步到首页/日历/提醒；非本人 404）
  /applications/{id}/interviews/{interview_id}/uncancel:
    post:
      summary: 恢复被取消的面试轮次
