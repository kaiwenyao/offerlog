# OfferLog CI (plan §12.5): format, vet, tests, typecheck, build per PR.
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: offerlog
          POSTGRES_PASSWORD: offerlog
          POSTGRES_DB: offerlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offerlog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: fmt + vet
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: unit + integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://offerlog:offerlog@localhost:5432/offerlog?sslmode=disable
        run: go test ./...
      - name: build
        working-directory: backend
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: component tests
        working-directory: frontend
        run: npx vitest run
      - name: build
        working-directory: frontend
        run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenAPI lint
        run: npx --yes @redocly/cli lint api/openapi.yaml --config api/redocly.yaml
      - name: migrations in sync
        run: |
          set -e
          # db/migrations is the canonical copy; internal/platform/migrate/migrations
          # is the embedded twin. Both directories must contain identical files in
          # both directions (a file added to only one side is drift too).
          for f in backend/db/migrations/*.sql; do
            b="backend/internal/platform/migrate/migrations/$(basename "$f")"
            test -f "$b" || { echo "migration drift: $b missing"; exit 1; }
            cmp "$f" "$b" || { echo "migration drift: $f differs from $b"; exit 1; }
          done
          for f in backend/internal/platform/migrate/migrations/*.sql; do
            a="backend/db/migrations/$(basename "$f")"
            test -f "$a" || { echo "migration drift: $a missing"; exit 1; }
          done
