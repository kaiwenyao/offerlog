# OfferLog 本地 Docker 部署（一条命令跑通，无 TLS / 无反代）。
#
#   make up   # 需先 cp .env.example .env（根目录 .env 必需，make 会自动带上）
#             # 手动等价：docker compose --env-file .env -f deploy/compose.local.yaml up -d --build
#
# 与 deploy/compose.yaml（生产式：Caddy HTTPS + 端口 80/443）的差异：
#   - 不起 Caddy：api 直接在 http://localhost:8080 服务 SPA + /api/v1
#   - postgres 暴露在 127.0.0.1:55432，方便本机 psql/DBeaker 连接排查
#   - 默认开放注册（REGISTRATION_OPEN=true）：首次使用直接在登录页注册账号，
#     「没有默认初始用户」；要闭门用就设 REGISTRATION_OPEN=false 并用
#     api-admin create-user 建号（见 docs/runbook.md）。
# 数据落在命名卷 pgdata_local / objects_local；`make down` 停止时连卷一起清掉。

name: offerlog-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-offerlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offerlog}
      POSTGRES_DB: ${POSTGRES_DB:-offerlog}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      # 必须按 .env 的口令真实走一次 TCP 认证：pg_isready 不做认证，检不出
      # 「数据卷是用旧的 POSTGRES_* 口令/用户名初始化」的情况（口令只在建卷首次
      # 生效），那会让 postgres 假健康、api/worker 因认证失败反复崩溃重启。
      # 注意不能连 127.0.0.1——postgres 镜像的 pg_hba 对回环是 trust（不验口令），
      # 连容器自身 IP 才会命中 scram-sha-256 规则、真正校验口令。
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$HOSTNAME\" -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-offerlog}:${POSTGRES_PASSWORD:-offerlog}@postgres:5432/${POSTGRES_DB:-offerlog}?sslmode=disable
      PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Dublin}
      CSRF_SECRET: ${CSRF_SECRET:-local-only-change-me}
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      HTTP_ADDR: :8080
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    volumes:
      - objects_local:/data/objects
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-offerlog}:${POSTGRES_PASSWORD:-offerlog}@postgres:5432/${POSTGRES_DB:-offerlog}?sslmode=disable
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      CSRF_SECRET: ${CSRF_SECRET:-local-only-change-me}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - objects_local:/data/objects
    restart: unless-stopped

volumes:
  pgdata_local:
  objects_local:
