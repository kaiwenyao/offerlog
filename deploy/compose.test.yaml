# OfferLog Docker 测试工具链（集成测试 + E2E，全部在容器里跑）。
#
#   # Go 单测 + 集成测试（真实 PostgreSQL 容器）：
#   docker compose -f deploy/compose.test.yaml --profile integration run --rm integration
#   docker compose -f deploy/compose.test.yaml --profile integration down -v --remove-orphans
#   # 起完整应用栈 + Playwright 容器跑主流程 E2E：
#   docker compose -f deploy/compose.test.yaml --profile e2e run --rm e2e
#   docker compose -f deploy/compose.test.yaml --profile e2e down -v --remove-orphans
#
# 设计：
#   - postgres 用 tmpfs —— 数据即弃、跑得快；每次 run 都是干净状态。
#   - integration：源码由 deploy/integration.Dockerfile COPY 进镜像（不 bind
#     mount —— Jenkins 经宿主 socket 跑 compose 时挂不到工作区），TEST_DATABASE_URL
#     指向 postgres 服务；模块/构建缓存放命名卷，二次运行只增量编译。
#   - e2e：基于 mcr.microsoft.com/playwright 镜像（内含浏览器），只装
#     scripts 的 npm 依赖；对 compose 内的 api 服务跑 smoke/e2e 脚本。
#   - bootstrap：与 compose.local 相同的一次性建号（e2e 依赖它完成）。

name: offerlog-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: offerlog
      POSTGRES_PASSWORD: offerlog
      POSTGRES_DB: offerlog
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerlog -d offerlog"]
      # 稳态 10s。3s 间隔在 CI 并发时会把 docker exec 堆成死亡螺旋：健康检查
      # 一旦耗时超过间隔（节点掉线时实测 45s），未返回的检查就无限累积，压垮
      # dockerd 与 kubelet 共用的那个 containerd —— kubelet 的 PLEG 随之超时，
      # 节点 NodeNotReady，Pod（含 Jenkins 控制器自身）被 taint 驱逐。
      # start_interval 让启动阶段仍按 1s 快速探测，不牺牲栈就绪速度。
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlog:offerlog@postgres:5432/offerlog?sslmode=disable
      PUBLIC_BASE: http://localhost:8082
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Dublin}
      CSRF_SECRET: test-only-secret
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      HTTP_ADDR: :8080
      DATA_DIR: /data
      LOG_LEVEL: warn
    volumes:
      - objects_test:/data/objects
    ports:
      # localhost-only: 方便本地用浏览器连进测试栈排查
      - "127.0.0.1:8082:8080"
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlog:offerlog@postgres:5432/offerlog?sslmode=disable
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      CSRF_SECRET: test-only-secret
      DATA_DIR: /data
      LOG_LEVEL: warn
    volumes:
      - objects_test:/data/objects
    restart: "no"

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlog:offerlog@postgres:5432/offerlog?sslmode=disable
      CSRF_SECRET: test-only-secret
      DATA_DIR: /data
      E2E_EMAIL: ${E2E_EMAIL:-me@example.com}
      E2E_PASSWORD: ${E2E_PASSWORD:-testpass12345}
    command:
      - /bin/sh
      - -c
      - |
        /app/api-admin create-user \
          -email "$$E2E_EMAIL" -password "$$E2E_PASSWORD" -name "Test" \
        && echo "bootstrap: user ready" \
        || echo "bootstrap: create-user skipped"
    restart: "no"

  integration:
    profiles: ["integration"]
    # 源码在镜像构建期 COPY 进去（见 deploy/integration.Dockerfile）——Jenkins
    # 的 k8s agent 经宿主节点 docker socket 跑 compose，bind mount 的 Pod
    # 工作区路径在宿主机上不存在，会静默挂成空目录。
    build:
      context: ..
      dockerfile: deploy/integration.Dockerfile
    environment:
      TEST_DATABASE_URL: postgres://offerlog:offerlog@postgres:5432/offerlog?sslmode=disable
      CGO_ENABLED: "0"
    volumes:
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    depends_on:
      # 不依赖 bootstrap（建号只服务 e2e）：测试 setup 自带 migrate.Up（PR #6，
      # 幂等 + advisory lock）。也不能依赖它 —— bootstrap 是秒退的一次性容器，
      # compose 在 bootstrap 启动后还要拉 integration 镜像，等待
      # service_completed_successfully 会错过其退出状态，报
      # "integration is missing dependency bootstrap"（CI 节点实测竞态）。
      postgres:
        condition: service_healthy
    restart: "no"

  e2e:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: deploy/e2e.Dockerfile
    environment:
      E2E_BASE: http://api:8080
      E2E_EMAIL: ${E2E_EMAIL:-me@example.com}
      E2E_PASSWORD: ${E2E_PASSWORD:-testpass12345}
    depends_on:
      api:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

volumes:
  objects_test:
  go_mod:
  go_build:
