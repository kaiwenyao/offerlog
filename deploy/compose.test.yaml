# OfferLogs Docker 测试工具链（集成测试 + E2E，全部在容器里跑）。
#
#   make test-integration   # Go 单测 + 集成测试（真实 PostgreSQL 容器）
#   make e2e-docker         # 起完整应用栈 + Playwright 容器跑主流程 E2E
#
# 设计：
#   - postgres 用 tmpfs —— 数据即弃、跑得快；每次 run 都是干净状态。
#   - integration：golang 容器挂载 backend/ 源码，TEST_DATABASE_URL 指向
#     postgres 服务；模块/构建缓存放命名卷，二次运行只增量编译。
#   - e2e：基于 mcr.microsoft.com/playwright 镜像（内含浏览器），只装
#     scripts 的 npm 依赖；对 compose 内的 api 服务跑 smoke/e2e 脚本。
#   - bootstrap：与 compose.local 相同的一次性建号（e2e 依赖它完成）。

name: offerlogs-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: offerlogs
      POSTGRES_PASSWORD: offerlogs
      POSTGRES_DB: offerlogs
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerlogs -d offerlogs"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlogs:offerlogs@postgres:5432/offerlogs?sslmode=disable
      PUBLIC_BASE: http://localhost:8082
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Dublin}
      CSRF_SECRET: test-only-secret
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      HTTP_ADDR: :8080
      DATA_DIR: /data
      LOG_LEVEL: warn
    volumes:
      - objects_test:/data/objects
    ports:
      # localhost-only: 方便本地用浏览器连进测试栈排查
      - "127.0.0.1:8082:8080"
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlogs:offerlogs@postgres:5432/offerlogs?sslmode=disable
      OBJECTSTORE_PROVIDER: local
      OBJECTSTORE_LOCAL_DIR: /data/objects
      CSRF_SECRET: test-only-secret
      DATA_DIR: /data
      LOG_LEVEL: warn
    volumes:
      - objects_test:/data/objects
    restart: "no"

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://offerlogs:offerlogs@postgres:5432/offerlogs?sslmode=disable
      CSRF_SECRET: test-only-secret
      DATA_DIR: /data
      E2E_EMAIL: ${E2E_EMAIL:-me@example.com}
      E2E_PASSWORD: ${E2E_PASSWORD:-testpass12345}
    command:
      - /bin/sh
      - -c
      - |
        /app/api-admin create-user \
          -email "$$E2E_EMAIL" -password "$$E2E_PASSWORD" -name "Test" \
        && echo "bootstrap: user ready" \
        || echo "bootstrap: create-user skipped"
    restart: "no"

  integration:
    profiles: ["integration"]
    image: golang:1.25-alpine
    working_dir: /src/backend
    command: sh -c "go test ./... -count=1"
    environment:
      TEST_DATABASE_URL: postgres://offerlogs:offerlogs@postgres:5432/offerlogs?sslmode=disable
      CGO_ENABLED: "0"
    volumes:
      - ../backend:/src/backend
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      # bootstrap runs migrate.Up (via create-user) — tests expect a migrated schema
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  e2e:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: deploy/e2e.Dockerfile
    environment:
      E2E_BASE: http://api:8080
      E2E_EMAIL: ${E2E_EMAIL:-me@example.com}
      E2E_PASSWORD: ${E2E_PASSWORD:-testpass12345}
    depends_on:
      api:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

volumes:
  objects_test:
  go_mod:
  go_build:
